{% extends "base.html" %}

{% block title %}Student Registration - Hostel Complaint System{% endblock %}

{% block content %}
<div class="card login-card">
    <h2>🎓 Student Registration</h2>
    <p style="color: var(--text-muted); margin-bottom: 20px;">Create a new student complaint account</p>

    <form method="POST" action="{{ url_for('student_register') }}">
        <div class="form-group">
            <label for="student_id">Student ID</label>
            <input 
                type="text" 
                id="student_id" 
                name="student_id" 
                placeholder="e.g. STU002" 
                required
            >
        </div>

        <div class="form-group">
            <label for="name">Full Name</label>
            <input 
                type="text" 
                id="name" 
                name="name" 
                placeholder="Enter full name" 
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="Create password" 
                required
            >
        </div>

        <button type="submit" class="btn btn-block">
            Register Account
        </button>
    </form>

    <div style="text-align: center; margin-top: 18px;">
        <a href="{{ url_for('student_login') }}" style="color: var(--primary-color); font-weight: 600; text-decoration: none;">
            Already registered? Login here
        </a>
    </div>
</div>
{% endblock %}
