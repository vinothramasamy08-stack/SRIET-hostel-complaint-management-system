{% extends "base.html" %}

{% block title %}Raise Complaint - Hostel Complaint System{% endblock %}

{% block content %}
<div class="card login-card" style="max-width: 580px;">
    <h2>📝 Raise a New Complaint</h2>
    <p style="color: var(--text-muted); margin-bottom: 22px;">Fill in details about the issue for hostel maintenance action.</p>

    <form method="POST" action="{{ url_for('raise_complaint') }}">
        <div class="form-group">
            <label for="category">Complaint Category</label>
            <select name="category" id="category" required>
                <option value="">Select Category</option>
                <option value="Room Maintenance">Room Maintenance</option>
                <option value="Electrical">Electrical (Fan, Light, Switch)</option>
                <option value="Plumbing">Plumbing (Tap, Leakage, Toilet)</option>
                <option value="Food">Food / Mess Issue</option>
                <option value="Cleanliness">Cleanliness & Hygiene</option>
                <option value="Internet">Internet / Wi-Fi</option>
                <option value="Water">Drinking / Bathing Water</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label for="location">Room / Location</label>
            <input 
                type="text" 
                name="location" 
                id="location" 
                placeholder="e.g. Block A - Room 204" 
                required
            >
        </div>

        <div class="form-group">
            <label for="description">Complaint Description</label>
            <textarea 
                name="description" 
                id="description" 
                rows="5" 
                placeholder="Describe your issue in detail..." 
                required
            ></textarea>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 25px;">
            <button type="submit" class="btn" style="flex: 1;">
                Submit Complaint
            </button>
            <a href="{{ url_for('student_dashboard') }}" class="btn btn-secondary">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
